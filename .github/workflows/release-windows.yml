name: release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão sem o prefixo v (ex. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version: $RAW"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $RAW"

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: liberica

      - name: Install Ant and NSIS
        run: choco install ant nsis -y --no-progress

      - name: Set Constants.VERSION
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $path = "src/qz/common/Constants.java"
          $content = Get-Content -Raw -Path $path
          $updated = [regex]::Replace($content, 'Version\.valueOf\("[^"]*"\)', "Version.valueOf(`"$version`")")
          if ($updated -eq $content) {
            throw "Failed to update Constants.VERSION"
          }
          Set-Content -Path $path -Value $updated -NoNewline
          Select-String -Path $path -Pattern 'VERSION' | Select-Object -First 5

      - name: Build Windows installer (x86_64)
        shell: cmd
        run: ant "-Dtarget.arch=x86_64" nsis

      - name: List build output
        shell: pwsh
        run: Get-ChildItem out/printtray-*.exe | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: printtray-windows-x86_64
          path: out/printtray-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PrintTray ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: out/printtray-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
