name: release

on:
  push:
    branches: [master]

concurrency:
  group: printtray-release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Evita loop: o próprio bump commit usa [skip ci]
    if: >-
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $path = "src/qz/common/Constants.java"
          $content = Get-Content -Raw -Path $path
          $match = [regex]::Match($content, 'Version\.valueOf\("([^"]+)"\)')
          if (-not $match.Success) {
            throw "Constants.VERSION not found"
          }

          $current = $match.Groups[1].Value
          Write-Host "Current version: $current"

          # 2.3.1-SNAPSHOT -> promove para 2.3.1
          # 2.3.1 -> bump patch 2.3.2
          if ($current -match '^(\d+)\.(\d+)\.(\d+)([-.].+)?$') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]
            $suffix = $Matches[4]
            if ($suffix) {
              $next = "$major.$minor.$patch"
            } else {
              $next = "$major.$minor.$($patch + 1)"
            }
          } else {
            throw "Unsupported version format: $current"
          }

          $updated = [regex]::Replace($content, 'Version\.valueOf\("[^"]*"\)', "Version.valueOf(`"$next`")")
          Set-Content -Path $path -Value $updated -NoNewline
          Write-Host "Bumped version: $current -> $next"

          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: liberica

      - name: Install Ant and NSIS
        run: choco install ant nsis -y --no-progress

      - name: Build Windows installer (x86_64)
        shell: cmd
        run: ant "-Dtarget.arch=x86_64" nsis

      - name: List build output
        shell: pwsh
        run: Get-ChildItem out/printtray-*.exe | Format-Table Name, Length

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qz/common/Constants.java
          git commit -m "Bump versão para ${{ steps.version.outputs.version }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: printtray-windows-x86_64
          path: out/printtray-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PrintTray ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: out/printtray-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
